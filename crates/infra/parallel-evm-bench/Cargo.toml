[package]
name = "base-parallel-evm-bench"
description = "Experiment: optimistic parallel execution of Base blocks vs the sequential executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
revm = { workspace = true, features = ["std"] }
eyre.workspace = true
dashmap.workspace = true
reth-evm.workspace = true
reth-revm.workspace = true
alloy-evm.workspace = true
alloy-eips.workspace = true
alloy-consensus = { workspace = true, features = ["serde"] }
alloy-primitives = { workspace = true, features = ["serde", "std"] }
alloy-provider = { workspace = true, features = ["reqwest"] }
reth-primitives-traits.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
base-common-evm.workspace = true
base-execution-evm.workspace = true
base-common-genesis.workspace = true
base-common-network.workspace = true
base-common-consensus.workspace = true
base-execution-chainspec.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
scheduler-watchdog = []
