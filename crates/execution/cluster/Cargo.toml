[package]
name = "base-execution-cluster"
description = "Clustered Base: state sharding across co-trusted execution nodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# reth
reth-trie.workspace = true
reth-db-api.workspace = true
reth-stages-types.workspace = true
reth-provider.workspace = true
reth-primitives-traits.workspace = true
reth-db = { workspace = true, features = ["mdbx"] }
reth-execution-types = { workspace = true, features = ["serde"] }
reth-trie-common = { workspace = true, features = ["serde-bincode-compat"] }

# revm
revm.workspace = true

# ethereum
alloy-rlp.workspace = true
alloy-trie.workspace = true
alloy-eips = { workspace = true, features = ["serde"] }
alloy-primitives = { workspace = true, features = ["serde"] }

# codec
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true, features = ["serde"] }
toml = { workspace = true, features = ["parse", "serde"] }

# misc
metrics.workspace = true
tracing.workspace = true
thiserror.workspace = true
parking_lot.workspace = true

[dev-dependencies]
rand.workspace = true
alloy-consensus.workspace = true
base-common-consensus = { workspace = true, features = ["reth"] }
tempfile.workspace = true
reth-tasks.workspace = true
reth-chainspec.workspace = true
reth-trie-db.workspace = true
reth-db = { workspace = true, features = ["test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
