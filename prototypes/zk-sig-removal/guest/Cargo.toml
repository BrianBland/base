[package]
name = "zk-sig-removal-guest"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", features = ["std"] }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-ecc-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-keccak256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
k256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", features = ["ecdsa"] }
alloy-trie = { version = "0.9", default-features = false }
# `native-keccak` routes alloy's keccak256 (used by the trie) to the OpenVM keccak chip.
alloy-primitives = { version = "1", default-features = false, features = ["native-keccak"] }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
