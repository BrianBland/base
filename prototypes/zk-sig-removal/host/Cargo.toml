[package]
name = "zk-sig-removal-host"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-build = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-circuit = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-transpiler = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-verify-stark-host = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.0.1" }
alloy-trie = "0.9"
alloy-primitives = { version = "1", features = ["k256"] }
alloy-eips = "1"
alloy-consensus = { version = "1", features = ["k256"] }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"

[features]
default = ["metrics"]
metrics = ["openvm-sdk/metrics", "openvm-stark-sdk/metrics"]
cuda = ["openvm-sdk/cuda"]

[profile.release]
lto = "thin"
