[package]
name = "zk-sig-removal-guest"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
zk-sig-removal-core = { path = "../../core" }
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.x.0-preview.2", features = ["std"] }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.x.0-preview.2" }
openvm-ecc-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.x.0-preview.2" }
openvm-keccak256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.x.0-preview.2" }
k256 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.x.0-preview.2", features = ["ecdsa"] }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
